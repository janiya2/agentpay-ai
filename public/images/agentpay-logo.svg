<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="50%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#03050c"/>
    </linearGradient>

    <!-- Outer Cyber Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="35%" stop-color="#0070BA"/>
      <stop offset="70%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Primary 'P' Monogram Gradient (PayPal Deep Blue) -->
    <linearGradient id="payGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CFDE"/>
      <stop offset="40%" stop-color="#0070BA"/>
      <stop offset="100%" stop-color="#002875"/>
    </linearGradient>

    <!-- Forward Agent Layer: Electric Cyan / Sky Blue -->
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- AI Core Spark Gradient -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#00E5FF"/>
      <stop offset="70%" stop-color="#0070BA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#003087" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.9"/>

  <!-- Glowing Ambient Halo Behind Logo Mark -->
  <circle cx="256" cy="256" r="150" fill="url(#sparkGlow)" opacity="0.28"/>

  <!-- Geometric AI Multi-Agent & PayPal Monogram -->
  <!-- Back PayPal Primary 'P' Layer -->
  <path d="M192 115 H280 C336 115 376 150 368 202 C360 254 316 282 260 282 H220 L196 405 H152 L192 115 Z" 
        fill="url(#payGrad)" 
        opacity="0.95"/>

  <!-- Forward Agent Layer: Interlocking Second 'P' with Integrated Agent Wing -->
  <path d="M232 170 H312 C356 170 384 198 378 238 C372 278 336 302 292 302 H256 L236 405 H196 L232 170 Z" 
        fill="url(#frontGrad)"/>

  <!-- Central Autonomous Neural Circuit Link -->
  <line x1="284" y1="236" x2="352" y2="175" stroke="#00E5FF" stroke-width="5" stroke-dasharray="8,5" opacity="0.9"/>
  <line x1="284" y1="236" x2="216" y2="305" stroke="#00E5FF" stroke-width="4" opacity="0.7"/>

  <!-- Core AI Nucleus (Glowing Diamond / Star) -->
  <g transform="translate(284, 236)">
    <circle cx="0" cy="0" r="24" fill="url(#sparkGlow)"/>
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
    <!-- Cyber Crosshairs / Energy Flares -->
    <path d="M-18 0 L18 0 M0 -18 L0 18" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Top-Right Autonomous Agent Satellite Node -->
  <circle cx="352" cy="175" r="9" fill="#00E5FF"/>
  <circle cx="352" cy="175" r="4" fill="#FFFFFF"/>

  <!-- Escrow Security Lock Accent Arc (Bottom Left) -->
  <path d="M165 375 Q195 415 240 415" stroke="#10B981" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.95"/>
  <circle cx="240" cy="415" r="5" fill="#10B981"/>
</svg>
